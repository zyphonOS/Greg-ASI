{% extends "base.html" %}
{% block title %}Chat · GregASI{% endblock %}
{% block content %}
<div class="greg-section">
  <h1 class="mb-2">CHAT WITH GREG</h1>
  <p class="muted mb-2">Direct line to the AOSI core. Greg is powered by Groq (llama-3.1-8b-instant).</p>
  <div class="greg-card mt-3" style="min-height:300px;max-height:60vh;overflow-y:auto;display:flex;flex-direction:column;gap:.6rem" id="chat-log">
    <div class="mono muted" style="font-size:.76rem">greg@asi:~$ ready.</div>
  </div>
  <div class="flex mt-2 gap-1">
    <input id="chat-input" class="mono" style="flex:1;background:#060a0d;border:1px solid var(--greg-border);color:var(--greg-green);padding:.65rem 1rem;border-radius:6px;font-size:.82rem;outline:none" placeholder="Ask Greg anything…" onkeydown="if(event.key==='Enter')sendMsg()" />
    <button class="btn btn-primary" onclick="sendMsg()">Send →</button>
  </div>
</div>
{% endblock %}
{% block extra_scripts %}
<script>
var log=document.getElementById('chat-log');
function addLine(who,text,color){
  var d=document.createElement('div');
  d.className='mono';d.style.fontSize='.8rem';d.style.color=color||'var(--greg-text)';
  d.textContent=who+': '+text;
  log.appendChild(d);log.scrollTop=log.scrollHeight;
}
function sendMsg(){
  var inp=document.getElementById('chat-input');
  var msg=inp.value.trim();if(!msg)return;
  inp.value='';
  addLine('you',msg,'var(--greg-white)');
  fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:msg})})
    .then(r=>r.json())
    .then(d=>addLine('greg',d.response||d.message||JSON.stringify(d),'var(--greg-green)'))
    .catch(e=>addLine('err',String(e),'#ff6060'));
}
</script>
{% endblock %}
