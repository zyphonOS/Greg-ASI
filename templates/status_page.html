{% extends "base.html" %}
{% block title %}Status · GregASI{% endblock %}
{% block content %}
<div class="greg-section">
  <h1 class="mb-2">SYSTEM STATUS</h1>
  <p class="muted mb-2">Live health of all GregASI subsystems.</p>
  <div class="grid-3 mt-3">
    <div class="greg-card">
      <div class="card-label">Greg Tick</div>
      <div class="card-value" id="st-tick">—</div>
    </div>
    <div class="greg-card">
      <div class="card-label">Constitution</div>
      <div class="card-value" id="st-const">—</div>
    </div>
    <div class="greg-card">
      <div class="card-label">Game of Life</div>
      <div class="card-value" id="st-gol">—</div>
    </div>
  </div>
  <div class="obc-terminal mt-3" id="st-raw" style="min-height:200px;white-space:pre-wrap;font-size:.7rem">Loading…</div>
</div>
{% endblock %}
{% block extra_scripts %}
<script>
(function(){
  function load(){
    fetch('/api/status').then(r=>r.json()).then(d=>{
      document.getElementById('st-tick').textContent=d.tick||'—';
      document.getElementById('st-raw').textContent=JSON.stringify(d,null,2);
    }).catch(()=>{});
    fetch('/api/ping').then(r=>r.json()).then(d=>{
      document.getElementById('st-tick').textContent=d.tick||'—';
    }).catch(()=>{});
    fetch('/api/constitution/benchmarks').then(r=>r.json()).then(d=>{
      document.getElementById('st-gol').textContent='gen '+(d.game_of_life?.generation||'—');
    }).catch(()=>{});
    fetch('/api/constitution/check').then(r=>r.json()).then(d=>{
      document.getElementById('st-const').textContent=d.matches?'✓ INTACT':'⚠ MISMATCH';
    }).catch(()=>{});
  }
  load();setInterval(load,5000);
})();
</script>
{% endblock %}
