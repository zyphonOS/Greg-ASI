{% extends "base.html" %}
{% block title %}ZyphonOS · GregASI{% endblock %}
{% block content %}
<div class="greg-section">
  <h1 class="mb-2">ZYPHONOS</h1>
  <p class="muted mb-2">The builder layer. Code, agents, and infrastructure are spawned and governed here.</p>
  <div class="grid-3 mt-3">
    <div class="greg-card">
      <div class="card-label">Active Agents</div>
      <div class="card-value" id="z-agents">—</div>
    </div>
    <div class="greg-card">
      <div class="card-label">Constitution Hash</div>
      <div class="card-value" id="z-hash" style="font-size:.9rem;word-break:break-all">—</div>
    </div>
    <div class="greg-card">
      <div class="card-label">Integrity</div>
      <div class="card-value" id="z-ok">—</div>
    </div>
  </div>
</div>
{% endblock %}
{% block extra_scripts %}
<script>
(function(){
  fetch('/api/status').then(r=>r.json()).then(d=>{
    document.getElementById('z-agents').textContent=d.agent_count||'—';
  }).catch(()=>{});
  fetch('/api/constitution/check').then(r=>r.json()).then(d=>{
    document.getElementById('z-hash').textContent=(d.constitution_hash||'—').slice(0,16)+'…';
    document.getElementById('z-ok').textContent=d.matches?'✓ INTACT':'⚠ MISMATCH';
  }).catch(()=>{});
})();
</script>
{% endblock %}
