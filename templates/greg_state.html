{% extends "base.html" %}
{% block title %}Greg State · GregASI{% endblock %}
{% block content %}
<div class="greg-section">
  <h1 class="mb-2">GREG STATE</h1>
  <p class="muted mb-2">Live introspection of the AOSI runtime. Soul, drift, and reality equation.</p>
  <div class="obc-terminal mt-3" id="state-out" style="min-height:320px;white-space:pre-wrap;font-size:.72rem">Loading…</div>
</div>
{% endblock %}
{% block extra_scripts %}
<script>
(function(){
  function load(){
    fetch('/api/status').then(r=>r.json()).then(d=>{
      document.getElementById('state-out').textContent=JSON.stringify(d,null,2);
    }).catch(e=>{document.getElementById('state-out').textContent='Error: '+e;});
  }
  load();setInterval(load,6000);
})();
</script>
{% endblock %}
