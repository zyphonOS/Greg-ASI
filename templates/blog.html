{% extends "base.html" %}
{% block title %}Blog · GregASI{% endblock %}
{% block content %}
<div class="greg-section">
  <h1 class="mb-2">BLOG</h1>
  <p class="muted mb-2">Dispatches from the Sovereign Dark Organism.</p>
  <div class="mt-3" id="blog-posts"><p class="muted mono" style="font-size:.8rem">Loading posts…</p></div>
</div>
{% endblock %}
{% block extra_scripts %}
<script>
(function(){
  fetch('/api/blog/posts').then(r=>r.json()).then(d=>{
    var posts=d.posts||d||[];
    var el=document.getElementById('blog-posts');
    if(!posts.length){el.innerHTML='<p class="muted mono" style="font-size:.8rem">No posts yet.</p>';return;}
    el.innerHTML=posts.map(function(p){
      return '<div class="greg-card mb-2"><div class="card-label">'+( p.created_at||'')+'</div><h3 style="color:var(--greg-white);margin:.3rem 0">'+p.title+'</h3><p class="muted" style="font-size:.88rem">'+p.summary+'</p></div>';
    }).join('');
  }).catch(()=>{document.getElementById('blog-posts').innerHTML='<p class="muted mono">Could not load posts.</p>';});
})();
</script>
{% endblock %}
